<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laman Utama Pembelajaran Fantasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            /* Gantikan 'background.jpg' dengan nama fail/URL gambar anda */
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .header-title {
            color: #FFF;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7), 0 0 10px #FFD700;
            font-size: 2.5rem;
            text-align: center;
            margin-top: 10px;
        }

        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            margin-bottom: 30px;
        }

        .btn-menu {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: #FFF8DC;
            border: 4px solid #FFD700;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            min-width: 180px;
            text-align: center;
        }

        .btn-menu:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, #A0522D, #CD853F);
            box-shadow: 0 12px 20px rgba(255, 215, 0, 0.6);
            color: #FFFFFF;
        }

        .btn-menu:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <h1 class="header-title">Dunia Pembelajaran Interaktif</h1>

    <div class="menu-container">
        <button class="btn-menu" onclick="bukaMenu('huruf')">1. Jom Kenal Huruf</button>
        <button class="btn-menu" onclick="bukaMenu('mengira')">2. Mari Mengira</button>
        <button class="btn-menu" onclick="bukaMenu('bentuk')">3. Bentuk dan Warna</button>
        <button class="btn-menu" onclick="bukaMenu('haiwan')">4. Haiwan dan Bunyi</button>
        <button class="btn-menu" onclick="bukaMenu('eja')">5. Tarik dan Eja</button>
    </div>

    <script>
        function bukaMenu(kategori) {
            alert('Mengakses modul: ' + kategori);
            // Tambah pautan modul di sini, contoh: window.location.href = kategori + '.html';
        }
    </script>
